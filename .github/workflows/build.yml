# Builds every PadLink deliverable. Manual trigger only.
# Public GitHub Releases are produced by release.yml (on a v* tag).
#
#   gh workflow run build.yml -f targets=all        # or: android | ios | windows
#
# Store signing is NOT done here yet: add the secrets listed in docs/store/PUBLISHING.md
# when you are ready to upload release builds.
name: build

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "test | android | ios | windows | all"
        default: all
        required: true

permissions:
  contents: read

jobs:
  # Security gate: end-to-end server tests + known-vulnerability audit of all dependencies.
  test:
    if: inputs.targets == 'all' || inputs.targets == 'test'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - name: Python deps
        shell: pwsh
        working-directory: server
        run: |
          python -m venv .venv
          $env:SKIP_CYTHON = '1'
          .venv\Scripts\python -m pip install --no-binary zeroconf -r requirements.txt -r requirements-desktop.txt -r requirements-dev.txt
      - name: pip-audit (known CVEs)
        working-directory: server
        run: .venv\Scripts\python -m pip_audit -r requirements.txt -r requirements-desktop.txt
      - name: npm audit (production deps)
        working-directory: client
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      - name: Client build (typecheck)
        working-directory: client
        run: npm run build
      - name: End-to-end tests
        working-directory: server
        run: .venv\Scripts\python -m pytest -q tests

  android:
    if: inputs.targets == 'all' || inputs.targets == 'android'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - name: Web build + sync
        working-directory: client
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Upload key from secrets (optional; without it the AAB is unsigned)
        working-directory: client/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
          fi
      - name: Gradle (release AAB + debug APK)
        working-directory: client/android
        run: ./gradlew --no-daemon bundleRelease assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            client/android/app/build/outputs/bundle/release/*.aab
            client/android/app/build/outputs/apk/debug/*.apk

  ios:
    if: inputs.targets == 'all' || inputs.targets == 'ios'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - name: Web build + sync
        working-directory: client
        run: |
          npm ci
          npm run build
          npx cap sync ios
      - name: Xcode build (device, unsigned)
        working-directory: client/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build | tail -n 60
          test "${PIPESTATUS[0]}" -eq 0

  windows:
    if: inputs.targets == 'all' || inputs.targets == 'windows'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: Build exe + installer
        shell: pwsh
        run: |
          python -m venv server\.venv
          ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/PadLink-Setup-*.exe
