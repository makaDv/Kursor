# Publishes a GitHub Release with the Windows installer and the Android APK.
#
#   git tag v1.1.0 && git push origin v1.1.0      # or run it by hand from the Actions tab
#
# The tag must match the version in client/package.json (scripts/release_check.py checks it).
# Android signing: add the repository secrets ANDROID_UPLOAD_KEYSTORE (base64 of the .jks)
# and ANDROID_UPLOAD_PASSWORD (plus ANDROID_KEY_ALIAS if the alias is not "upload").
# Use the same key for every release, or users cannot update. Without them the release ships the debug APK instead.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v1.1.1 (empty = current branch)"
        required: false
      dry_run:
        description: "Build and smoke-test only, do not publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - name: Build exe + installer
        shell: pwsh
        run: |
          python -m venv server\.venv
          ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: "dist/PadLink-Setup-*.exe" }

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag || github.ref }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: client/package-lock.json }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - name: Web build + sync
        working-directory: client
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Signing key from secrets (optional)
        working-directory: client/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEYSTORE_PASSWORD" > keystore.properties
          fi
      - name: Gradle (signed release APK, or debug APK without a key)
        working-directory: client/android
        run: |
          VERSION=$(node -p "require('../package.json').version")
          mkdir -p "$RUNNER_TEMP/out"
          if [ -f keystore.properties ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/PadLink-$VERSION.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/PadLink-$VERSION.apk"
          fi
          rm -f keystore.properties
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "${{ runner.temp }}/out/*.apk" }

  # Clean-machine check of the installer: silent install, first start, server answers,
  # screenshot, silent uninstall. The release is published only if this passes.
  smoke-windows:
    needs: windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with: { name: windows, path: setup }
      - name: Install, start, check, uninstall
        shell: pwsh
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem setup\PadLink-Setup-*.exe).FullName
          Write-Host "Installing $setup"
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $p.WaitForExit(180000)) { throw 'installer did not finish in 3 minutes' }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          Write-Host 'Installed'
          $app = Join-Path $env:LOCALAPPDATA 'Programs\PadLink'
          if (-not (Test-Path "$app\PadLink.exe")) { throw 'PadLink.exe not installed' }
          # Fresh user data; the terms are accepted in advance (the dialog needs a click).
          $data = Join-Path $env:RUNNER_TEMP 'padlink-data'
          New-Item -ItemType Directory $data | Out-Null
          '{"version": 1, "accepted_at": 0}' | Set-Content "$data\consent.json" -Encoding ascii
          $proc = Start-Process "$app\PadLink.exe" -ArgumentList '--data-dir', $data -PassThru
          $code = '000'
          foreach ($i in 1..60) {
            Start-Sleep 1
            if ($proc.HasExited) { throw "PadLink exited early (code $($proc.ExitCode))" }
            $code = & curl.exe -k -s --max-time 5 -o NUL -w '%{http_code}' https://127.0.0.1:8443/api/health
            Write-Host "try $i -> $code"
            if ($code -ne '000') { break }
          }
          Write-Host "GET /api/health -> HTTP $code"
          if ($code -eq '000') { throw 'server did not answer on port 8443' }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:RUNNER_TEMP\padlink-first-start.png")
          Stop-Process -Id $proc.Id -Force
          Start-Sleep 2
          Write-Host 'Uninstalling'
          $u = Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru
          if (-not $u.WaitForExit(120000)) { throw 'uninstaller did not finish in 2 minutes' }
          foreach ($i in 1..30) { if (-not (Test-Path "$app\PadLink.exe")) { break }; Start-Sleep 1 }
          if (Test-Path "$app\PadLink.exe") { throw 'uninstall left PadLink.exe behind' }
          Write-Host 'Install, first start and uninstall OK'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-windows-screenshot, path: "${{ runner.temp }}/padlink-first-start.png", if-no-files-found: ignore }

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [windows, android, smoke-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "{windows,android}", path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: assets/*
          overwrite_files: false   # never replace assets uploaded by hand (e.g. a locally signed APK)
          body: |
            **Come installare:** scarica `PadLink-Setup-*.exe` sul PC e `PadLink-*.apk` sul telefono Android.
            Guida completa: https://github.com/makaDv/PadLink/blob/main/docs/GUIDA.md
