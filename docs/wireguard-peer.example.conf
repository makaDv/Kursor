# WireGuard client config for the phone (import into the official WireGuard app).
# Replace the placeholders. The server side runs on your router or on a small
# always-on box/VPS. PadLink then stays reachable only at its LAN/VPN address.

[Interface]
PrivateKey = <PHONE_PRIVATE_KEY>
Address = 10.8.0.2/32
DNS = 1.1.1.1

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
Endpoint = <your-public-ip-or-ddns>:51820
# Route only the home LAN + VPN subnet through the tunnel (split tunnel).
AllowedIPs = 10.8.0.0/24, 192.168.1.0/24
PersistentKeepalive = 25
