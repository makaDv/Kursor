ext {
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "io.github.makadv.kursor.nativebridge"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        consumerProguardFiles 'proguard-rules.pro'
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    lint {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // HTTP + WebSocket with a custom (pinned) TrustManager. Apache-2.0, no telemetry.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    // Offline QR scanner (pure ZXing, Apache-2.0). Deliberately not Google ML Kit,
    // which sends usage metrics to Google and would have to be declared in Data safety.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    // Fingerprint / face unlock (on-device, nothing leaves the phone).
    implementation 'androidx.biometric:biometric:1.1.0'
    // Google Play In-App Review: the rating dialog is shown by the Play Store app itself.
    implementation 'com.google.android.play:review:2.0.2'
}
